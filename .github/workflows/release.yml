name: Release

on:
  push:
    tags:
      - "v*"

# 🚫 prevent random cancellation
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sublgen

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sublgen.exe

          # modern mac (ARM)
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: sublgen

          # optional: intel mac support
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: sublgen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 🔥 FIXED PACKAGE STEP (NO MORE FAIL)
      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"

          if [ ! -f "$BIN_PATH" ]; then
            echo "Fallback → target/release"
            BIN_PATH="target/release/${{ matrix.bin }}"
          fi

          if [ ! -f "$BIN_PATH" ]; then
            echo "ERROR: binary not found"
            ls -R target
            exit 1
          fi

          cp "$BIN_PATH" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}